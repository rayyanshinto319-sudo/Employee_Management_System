{% extends 'employees/base.html' %}
{% block title %}Login – Employee Management System{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Login to Your Account</h2>

    <form method="POST" novalidate>
      {% csrf_token %}

      <div class="form-group">
        <label for="id_username">Username</label>
        <input type="text" id="id_username" name="username" placeholder="Username" required>
      </div>

      <div class="form-group">
        <label for="id_password">Password</label>
        <input type="password" id="id_password" name="password" placeholder="Password" required>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="remember_me" name="remember_me">
        <label for="remember_me" style="text-transform:none;letter-spacing:0;font-size:.875rem;color:var(--gray-600);font-weight:400;">Remember me</label>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Login</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
  </div>
</div>
{% endblock %}
